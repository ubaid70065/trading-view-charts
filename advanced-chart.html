<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Advanced Chart (Embed)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F0F0F; }
    .tradingview-widget-container { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <!-- TradingView Widget BEGIN -->
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
    <div class="tradingview-widget-copyright">
      <a href="https://www.tradingview.com/symbols/NASDAQ-AAPL/" rel="noopener nofollow" target="_blank">
        <span class="blue-text">AAPL stock chart</span></a>
      <span class="trademark"> by TradingView</span>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
    {
      "allow_symbol_change": true,
      "calendar": false,
      "details": false,
      "hide_side_toolbar": false,
      "hide_top_toolbar": false,
      "hide_legend": false,
      "hide_volume": false,
      "hotlist": false,
      "interval": "D",
      "locale": "en",
      "save_image": true,
      "style": "1",
      "symbol": "NASDAQ:AAPL",
      "theme": "dark",
      "timezone": "Etc/UTC",
      "backgroundColor": "#0F0F0F",
      "gridColor": "rgba(242, 242, 242, 0.06)",
      "watchlist": ["###STOCKS", "AAPL", "GOOGL", "MSFT", "AMZN", "NIFTY 50", "PAYTM", "###CRYPTO", "BTCUSD", "ETHUSD"],
      "withdateranges": true,
      "compareSymbols": [],
      "studies": [],
      "autosize": true
    }
    </script>
  </div>
  <!-- TradingView Widget END -->
</body>
</html>
