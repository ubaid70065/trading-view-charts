<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charting Library — UI Customization Showcase</title>

  <!--
    ⚠️ REQUIRES THE LICENSED CHARTING LIBRARY.
    This page will NOT render until the `charting_library/` folder from your
    private TradingView repo sits next to this file. Until then, use
    index.html (the hub) and the free demos.

    This file demonstrates the widget-constructor surface behind the UI Elements
    doc: top toolbar, chart styles, scales, legend, custom buttons, saved
    layouts, featureset toggles, time zones. The datafeed (datafeed.js) is
    unchanged — UI config lives entirely in the widget constructor / API.
  -->
  <script src="charting_library/charting_library.standalone.js"></script>
  <script src="datafeed.js"></script>

  <style>
    html, body { margin: 0; height: 100%; }
    #chart { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Save/load is handled by the predefined REST API (charts-server.js on :8001) —
      // see charts_storage_url below. The built-in Save/Load buttons drive it.

      const widget = new TradingView.widget({
        container: 'chart',
        library_path: 'charting_library/',
        datafeed: createBinanceDatafeed({ quoteAsset: 'USDT' }),

        // ---- Symbol, resolution, time zone (Top toolbar + Time zones) ----
        symbol: 'BTCUSDT',
        interval: '60',
        timezone: 'Etc/UTC',
        locale: 'en',
        theme: 'dark',
        autosize: true,
        symbol_search_request_delay: 500, // debounce symbol-search requests (ms)

        // ---- Time frame toolbar: follows the doc's conventional mapping, but
        //      each `resolution` must be in the datafeed's supported_resolutions
        //      or the button is hidden. The doc's 6M->120 (2h) isn't native to
        //      Binance klines in our set, so 6M uses 240 (4h) instead. ----
        time_frames: [
          { text: '1D', resolution: '1', description: '1 Day' },
          { text: '5D', resolution: '5', description: '5 Days' },
          { text: '1M', resolution: '30', description: '1 Month' },
          { text: '3M', resolution: '60', description: '3 Months' },
          { text: '6M', resolution: '240', description: '6 Months' }, // doc: 120 (unsupported here) -> nearest native
          { text: '1Y', resolution: '1W', description: '1 Year' },
          { text: '5Y', resolution: '1W', description: '5 Years' },
        ],

        // ---- Save/load via the predefined REST API (charts-server.js on :8001).
        //      Built-in Save/Load buttons + study templates persist per client/user. ----
        charts_storage_url: 'http://localhost:8001',
        charts_storage_api_version: '1.1',
        client_id: 'trading-view-demo',
        user_id: 'public_user',
        load_last_chart: true,   // auto-load the most recent saved chart on startup
        auto_save_delay: 5,

        // ---- Featuresets: enable/disable Top toolbar & other UI elements ----
        enabled_features: [
          'header_symbol_search',      // Symbol Search button
          'header_resolutions',        // Resolution selector
          'header_chart_type',         // Chart styles dropdown
          'header_indicators',         // Indicators dialog
          'header_screenshot',         // Snapshots button
          'left_toolbar',              // Drawing toolbar
          'custom_resolutions',        // let users add their own resolutions (gated by supported_resolutions)
          'header_saveload',           // built-in Save/Load layout buttons (backed by charts_storage_url)
          'study_templates',           // save/load indicator templates (same REST backend)
        ],
        disabled_features: [
          'use_localstorage_for_settings', // we manage persistence ourselves below
          'popup_hints',
        ],

        // ---- Chart styles, Price/Time scale, Legend (via overrides) ----
        overrides: {
          // Chart pane background & grid
          'paneProperties.background': '#0F0F0F',
          'paneProperties.backgroundType': 'solid',
          'paneProperties.vertGridProperties.color': 'rgba(242,242,242,0.06)',
          'paneProperties.horzGridProperties.color': 'rgba(242,242,242,0.06)',
          // Legend
          'paneProperties.legendProperties.showSeriesTitle': true,
          'paneProperties.legendProperties.showVolume': true,
          // Candle chart style colors
          'mainSeriesProperties.candleStyle.upColor': '#089981',
          'mainSeriesProperties.candleStyle.downColor': '#f23645',
          'mainSeriesProperties.candleStyle.wickUpColor': '#089981',
          'mainSeriesProperties.candleStyle.wickDownColor': '#f23645',
          'mainSeriesProperties.candleStyle.borderVisible': false,
          // Scales
          'scalesProperties.textColor': '#d1d4dc',
          'scalesProperties.lineColor': 'rgba(242,242,242,0.12)',
          // Drawing defaults (Drawing overrides) — applied when users draw.
          // (linetool* override keys are version-sensitive — verify against yours.)
          'linetooltrendline.linecolor': '#2962ff',
          'linetoolhorzline.linecolor': '#f0a020',
          'linetoolhorzline.linestyle': 2, // dashed
        },

        // ---- Indicators: default styling (Style customization) & a cap ----
        // Our datafeed provides volume (visible_plots_set:'ohlcv'), so the auto
        // Volume indicator and volume-based studies (VWAP, OBV, MFI...) all work
        // — no studies_access blacklist needed.
        studies_overrides: {
          // Colors MUST be #RRGGBB (rgba()/#RGB are rejected). Opacity is a
          // SEPARATE `transparency` property in [0..100], not a color alpha.
          // For Volume, color.1 is the up color, color.0 the down color.
          'volume.volume.color.0': '#f23645',   // down volume
          'volume.volume.color.1': '#089981',   // up volume
          'volume.volume.transparency': 50,     // was baked into rgba alpha before
          'moving average.plot.color': '#2962ff',
          'moving average.plot.linewidth': 2,
        },
        study_count_limit: 10, // max simultaneous indicators

        // ---- Drawings: default favourite tools on the drawing toolbar.
        //      (Tool IDs like 'LineToolTrendLine' are version-sensitive — verify.)
        favorites: {
          intervals: ['15', '60', '240', '1D'],
          drawingTools: ['LineToolTrendLine', 'LineToolHorzLine', 'LineToolFibRetracement'],
        },
        // Use drawings_access to hide/restrict specific tools, e.g.:
        // drawings_access: { type: 'black', tools: [{ name: 'Regression Trend' }] },
      });

      // ---- Custom buttons + chart-API wiring (runs after the chart is ready) ----
      widget.onChartReady(() => {
        // load_last_chart may restore a layout whose stored theme/background
        // mismatches (Theme doc caveat). Re-apply the theme and force the
        // background via applyOverrides (precedence 1) to guarantee it.
        widget.changeTheme('dark').then(() => {
          widget.activeChart().applyOverrides({
            'paneProperties.background': '#0F0F0F',
            'paneProperties.backgroundType': 'solid',
          });
        });

        widget.headerReady().then(() => {
          // Save/Load layouts now use the built-in header buttons (header_saveload),
          // backed by the REST server. No custom Save/Reset buttons needed.

          // Custom dropdown -> quick symbol switch (createDropdown, top toolbar only).
          widget.createDropdown({
            title: 'Symbol',
            tooltip: 'Quick symbol switch',
            items: ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT'].map((sym) => ({
              title: sym,
              onSelect: () => widget.activeChart().setSymbol(sym),
            })),
          });

          // Snapshots: client-side PNG via takeClientScreenshot (no server needed).
          const snapBtn = widget.createButton();
          snapBtn.setAttribute('title', 'Download a PNG snapshot of the chart');
          snapBtn.textContent = '📷 PNG';
          snapBtn.addEventListener('click', async () => {
            const canvas = await widget.takeClientScreenshot({ hideStudiesFromLegend: true });
            const a = document.createElement('a');
            a.download = 'chart.png';
            a.href = canvas.toDataURL(); // toBlob is preferable for large images
            a.click();
          });
        });

        // ---- Auto-save: push to the REST server whenever the library signals
        //      a change (debounced by auto_save_delay). High-level counterpart of
        //      the low-level widget.save(). ----
        widget.subscribe('onAutoSaveNeeded', () => widget.saveChartToServer());

        // ---- Chart API: manage indicators (Manage drawings and indicators) ----
        const chart = widget.activeChart();
        // MA is a PRICE study -> overlays the main pane on the main scale by default.
        // RSI is a NON-PRICE study (0-100) -> gets its own pane by default.
        // 2nd arg is forceOverlay; a 6th options arg can set priceScale
        // (e.g. { priceScale: 'new-left' }). (Inputs signature varies by version.)
        chart.createStudy('Moving Average', false, false, [20]);
        chart.createStudy('Relative Strength Index', false, false, [14]);

        // ---- Chart API: subscribe to events (Events and subscriptions) ----
        chart.onSymbolChanged().subscribe(null, () => console.log('[chart] symbol ->', chart.symbol()));
        chart.onIntervalChanged().subscribe(null, (interval) => console.log('[chart] interval ->', interval));
        chart.onDataLoaded().subscribe(null, () => console.log('[chart] data loaded'), true);

        // ---- Drawings API: log create/move/property-change events ----
        widget.subscribe('drawing_event', (id, type) => console.log('[drawing]', type, id));

        // ---- Context menu: add a custom item showing the clicked price ----
        widget.onContextMenu((unixtime, price) => [
          { position: 'top', text: `Copy price ${price}`, click: () => navigator.clipboard && navigator.clipboard.writeText(String(price)) },
          { text: '-', position: 'top' }, // separator
        ]);

        // ---- Watermark API: subtle ticker/description/interval overlay.
        //      (Docs recommend letting USERS enable this; shown for demo. Content
        //      comes from resolveSymbol's name/description fields.) ----
        const wm = widget.watermark();
        wm.color().setValue('rgba(120,130,150,0.10)');
        wm.tickerVisibility().setValue(true);
        wm.descriptionVisibility().setValue(true);
        wm.intervalVisibility().setValue(true);
      });
    });
  </script>
</body>
</html>
