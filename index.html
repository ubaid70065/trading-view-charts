<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Chart</title>

    <!--
      The charts are the slow part: each pane fetches a vendor script from
      s3.tradingview.com and then opens a frame on tradingview-widget.com.
      Warming both connections here overlaps DNS and TLS with parsing this
      document instead of waiting for the first pane to ask.
    -->
    <link rel="preconnect" href="https://s3.tradingview.com" crossorigin>
    <link rel="preconnect" href="https://www.tradingview-widget.com" crossorigin>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/app.css">

    <!--
      ES modules are discovered one level at a time: without these the browser
      learns about panes.js only after main.js parses, and about widget.js only
      after that. Naming the graph up front collapses those round trips into one.
    -->
    <link rel="modulepreload" href="src/main.js">
    <link rel="modulepreload" href="src/config.js">
    <link rel="modulepreload" href="src/state.js">
    <link rel="modulepreload" href="src/panes.js">
    <link rel="modulepreload" href="src/widget.js">
    <link rel="modulepreload" href="src/header.js">
    <link rel="modulepreload" href="src/layout-picker.js">
    <link rel="modulepreload" href="src/search.js">
    <link rel="modulepreload" href="src/shortcuts.js">
</head>
<body>
    <header class="topbar">
        <div class="topbar__brand">
            <span class="topbar__mark" aria-hidden="true">◫</span>
            <span class="topbar__title">Advanced Chart</span>
            <span class="status" id="status" data-state="detecting">detecting…</span>
        </div>

        <form class="topbar__search" id="searchForm" role="search">
            <span class="search__icon" aria-hidden="true">⌕</span>
            <input type="search" class="search__input" id="symbolSearch"
                   placeholder="Search a symbol, press Enter — NASDAQ:AAPL, NSE:RELIANCE"
                   aria-label="Symbol search" autocomplete="off" spellcheck="false">
            <button type="button" class="search__scope" id="searchScope" aria-pressed="true">All charts</button>
        </form>

        <nav class="topbar__actions">
            <div class="menu-wrap">
                <button type="button" class="btn" id="layoutBtn" aria-haspopup="true" aria-expanded="false" aria-controls="layoutMenu" title="Choose a chart layout (Alt+L)">
                    <span class="btn__icon" aria-hidden="true"></span><span class="btn__text">Layout</span>
                </button>
                <div class="menu" id="layoutMenu" role="menu" hidden></div>
            </div>

            <button type="button" class="btn" id="themeBtn" title="Toggle dark / light theme (Alt+D)">
                <span class="btn__icon" aria-hidden="true">☾</span><span class="btn__text">Dark</span>
            </button>
        </nav>
    </header>

    <div class="ticker" id="tickerHost"></div>

    <main class="panes" id="panesHost"></main>

    <footer class="footbar">
        <div class="attribution" id="attributionHost"></div>
    </footer>

    <div class="banner" id="banner" hidden></div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
