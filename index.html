<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Chart</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar__brand">
            <span class="topbar__mark" aria-hidden="true">◫</span>
            <span class="topbar__title">Advanced Chart</span>
            <span class="status" id="status" data-state="detecting">detecting…</span>
        </div>

        <nav class="topbar__actions">
            <div class="menu-wrap">
                <button type="button" class="btn" id="layoutBtn" aria-haspopup="true" aria-expanded="false" aria-controls="layoutMenu" title="Choose a chart layout (Alt+L)">
                    <span class="btn__icon" aria-hidden="true"></span><span class="btn__text">Layout</span>
                </button>
                <div class="menu" id="layoutMenu" role="menu" hidden></div>
            </div>

            <button type="button" class="btn" id="themeBtn" title="Toggle dark / light theme">
                <span class="btn__icon" aria-hidden="true">☾</span><span class="btn__text">Dark</span>
            </button>

            <button type="button" class="btn" id="snapshotBtn" title="Save a PNG of the workspace">
                <span class="btn__icon" aria-hidden="true">▣</span><span class="btn__text">Snapshot</span>
            </button>

            <button type="button" class="btn" id="shortcutsBtn" title="Keyboard shortcuts">
                <span class="btn__icon" aria-hidden="true">⌘</span><span class="btn__text">Shortcuts</span>
            </button>

            <button type="button" class="btn" id="settingsBtn" title="Settings">
                <span class="btn__icon" aria-hidden="true">⚙</span><span class="btn__text">Settings</span>
            </button>
        </nav>
    </header>

    <div class="ticker" id="tickerHost"></div>

    <main class="panes" id="panesHost"></main>

    <footer class="footbar">
        <div class="tabs" id="tabsHost"></div>
        <div class="attribution" id="attributionHost"></div>
    </footer>

    <div class="banner" id="banner" hidden></div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
